_defaults:
  - ./_defaults_evaluate.yml
  - configs/stabilizers/hdrnet/spatial_ema_stabilizer.yml

frame_transform:
  _target: torchvision.transforms.Compose
  transforms:
    - _target: torchvision.transforms.Resize
      antialias: true
      size: 360
    - _target: stability.transforms.elastic_transform.ElasticTransform
      magnitude: 50.0
      smoothness: 5.0

dataset:
  frame_transform: ${frame_transform}
