_defaults:
  - ./_defaults_evaluate.yml
dataset:
  frame_transform:
    _target: torchvision.transforms.Compose
    transforms:
      - _target: torchvision.transforms.Resize
        antialias: true
        size: 360
      - _target: instant_video_models.transforms.chunk_drop.ChunkDrop
        chunk_size: 8
        drop_ratio: 0.1
