_defaults:
  - ./_defaults_evaluate.yml
dataset:
  frame_transform:
    _target: torchvision.transforms.Compose
    transforms:
      - _target: torchvision.transforms.Resize
        antialias: true
        size: 360
      - _target: instant_video_models.transforms.salt_pepper_noise.SaltPepperNoise
        salt_amount: 0.05
        pepper_amount: 0.05
