_defaults:
  - configs/evaluate/evaluate_nafnet_nfs.yml
  - configs/stabilizers/nafnet/controlled_composed.yml
input_transform:
  _target: torchvision.transforms.Compose
  transforms: ${compose_transforms}
override_weights_filepath: ${_original_dir}/WEIGHTS_FILEPATH
gaussian_noise:
  _target: instant_video_models.transforms.gaussian_noise.GaussianNoise
  sigma: 0.1
chunk_drop:
  _target: instant_video_models.transforms.chunk_drop.ChunkDrop
  chunk_size: 8
  drop_ratio: 0.1
elastic_transform:
  _target: instant_video_models.transforms.elastic_transform.ElasticTransform
  magnitude: 50.0
  smoothness: 5.0
frame_drop:
  _target: instant_video_models.transforms.frame_drop.FrameDrop
  drop_ratio: 0.1
jpeg_compression:
  _target: instant_video_models.transforms.jpeg_compression.JPEGCompression
  quality: 10
salt_pepper_noise:
  _target: instant_video_models.transforms.salt_pepper_noise.SaltPepperNoise
  salt_amount: 0.05
  pepper_amount: 0.05
