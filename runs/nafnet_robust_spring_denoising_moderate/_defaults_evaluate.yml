_defaults:
  - configs/evaluate/evaluate_nafnet_robust_spring.yml
  - ./_finetuned_weights.yml

# Add noise to corrupted inputs but not clean outputs (ground truth).
corruption_type: null
corrupted_transform:
  _target: torchvision.transforms.Compose
  transforms:
    - _target: torchvision.transforms.Resize
      antialias: true
      size: 720
    - _target: stability.transforms.gaussian_noise.GaussianNoise
      sigma: 0.1
dataset:
  corruption_type: ${corruption_type}
  corrupted_transform: ${corrupted_transform}
