stabilizers:
  # One stabilizer on each Conv2d layer
  - filter:
      typename: Conv2d
    module:
      _target: instant_video_models.stabilizers.simple_learned_stabilizer.SimpleLearnedStabilizer
      channel_axis: 1
      hook_target: output
      logits_init: 4.0

    # Required for parameters to be visible
    registration_name: stabilizer

  # One stabilizer on each Linear layer (found in the global net)
  - filter:
      typename: Linear
    module:
      _target: instant_video_models.stabilizers.simple_learned_stabilizer.SimpleLearnedStabilizer
      channel_axis: -1
      hook_target: output
      logits_init: 4.0

    # Required for parameters to be visible
    registration_name: stabilizer

  # One stabilizer on the output
  - filter:
      name: ''
    module:
      _target: instant_video_models.stabilizers.simple_learned_stabilizer.SimpleLearnedStabilizer
      channel_axis: 1
      hook_target: output
      logits_init: 4.0

    # Required for parameters to be visible
    registration_name: stabilizer
