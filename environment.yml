name: instant-video-models
channels:
  - defaults
dependencies:
  - conda-forge::av=11.0
  - black=23.11
  - nvidia::cuda=11.8
  - conda-forge::einops=0.8
  - conda-forge::ffmpeg=6.1
  - huggingface_hub=0.23
  - matplotlib=3.8
  - numpy=1.26
  - conda-forge::omegaconf=2.3
  - conda-forge::openexr=3.2
  - conda-forge::opencv=4.10
  - pip=23.3
  - conda-forge::pycocotools=2.0
  - conda-forge::pymediainfo=6.1
  - pytest=7.4
  - python=3.11
  - pytorch::pytorch=2.1
  - pytorch::pytorch-cuda=11.8
  - scikit-image=0.23
  - scipy=1.11
  - conda-forge::streamlit=1.37
  - conda-forge::tensorboard=2.16
